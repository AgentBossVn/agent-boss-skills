name: Thử skill ảnh quảng cáo trên Windows + Mac

on:
  push:
  workflow_dispatch:

jobs:
  thu:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Python nào cũng được: bộ thử tự cài Python 3.12 riêng bằng uv như người dùng thật
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # Windows mới tinh KHÔNG có lệnh `python` thật: người dùng đi đường mồi `py -3`. Đường này gọi máy kiểm đúng kiểu đó, ở cả 2 shell
      - name: Windows - máy kiểm qua đường mồi py -3 (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          py -3 --version
          $out = py -3 anh-quang-cao-san-pham/scripts/kiem-cong-cu-ve.py | Out-String
          if ($LASTEXITCODE -ne 0 -or $out -notmatch '\|---\|---\|---\|') { Write-Host $out; exit 1 }
          Write-Host ($out -split "`n" | Select-Object -First 6)
      - name: Windows - máy kiểm qua đường mồi py -3 (Git Bash)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          py -3 --version
          py -3 anh-quang-cao-san-pham/scripts/kiem-cong-cu-ve.py > kiem.txt
          grep -q -e '|---|---|---|' kiem.txt && head -6 kiem.txt
      - name: Chạy bộ thử
        run: python kiem-thu/chay-thu.py
      - name: Thử skill bộ nhận diện
        run: python kiem-thu/thu-bo-nhan-dien.py
      - name: Thử skill tiết kiệm token
        run: python kiem-thu/thu-tiet-kiem-token.py
      - name: Bộ kiểm riêng của skill tiết kiệm token
        working-directory: tiet-kiem-token
        run: python -B -m unittest discover -s tests

  thu-tiet-kiem-token-linux:
    # Skill tiết kiệm token hứa chạy Linux + Python 3.8: thử đúng mức thấp nhất đó
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.8'
      - run: python kiem-thu/thu-tiet-kiem-token.py
      - working-directory: tiet-kiem-token
        run: python -B -m unittest discover -s tests
