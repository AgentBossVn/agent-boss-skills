name: Thử bộ skill video trên Windows + Mac

on:
  push:
    paths: ['nguon/video/**', 'video-*/**', '.github/workflows/thu-video.yml']
  workflow_dispatch:

jobs:
  thu:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Cài ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Cài ffmpeg (Mac)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Thư viện Python
        run: python -m pip install pillow numpy
      - name: Skill đã đóng gói khớp với nguồn
        shell: bash
        run: |
          python nguon/video/dong-goi.py
          git diff --exit-code -- 'video-*' || { echo "Chưa chạy nguon/video/dong-goi.py sau khi sửa nguồn"; exit 1; }
      - name: Dựng thử 3 kiểu video
        run: python nguon/video/kiem-thu/chay.py
